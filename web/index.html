<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Marco Designs — Buildable Envelope Configurator</title>
  </head>
  <body>
    <div id="root">
      <main
        id="startup-fallback"
        style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Lato,Arial,sans-serif;background:#fff;color:#292824"
      >
        <section style="width:min(520px,100%);padding:28px;border:1px solid #ded1ad;border-radius:16px;background:#fffdf8;box-shadow:0 14px 36px rgba(41,40,36,.08)">
          <strong style="display:block;margin-bottom:8px;font-size:20px">Marco Designs</strong>
          <span style="color:#6c6656">Loading the property configurator…</span>
        </section>
      </main>
    </div>
    <noscript>
      <p style="padding:24px;font-family:Arial,sans-serif">
        JavaScript is required to use the Marco Designs property configurator.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
